version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: verdict-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: verdict-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=verdict_db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=llama3-70b-8192
      - APP_ENV=production
    depends_on:
      - mongodb
    volumes:
      - ./storage:/app/storage

  edge-gateway:
    build: .
    container_name: verdict-edge-gateway
    command: python -m edge_gateway.main
    ports:
      - "8001:8001"
    environment:
      - VERDICT_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
